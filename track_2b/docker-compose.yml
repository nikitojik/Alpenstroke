name: alpenstroke

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: alpenstroke
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alpenstroke}
      POSTGRES_DB: alpenstroke
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U alpenstroke" ]
      interval: 5s
      retries: 10

  alpenstroke:
    build: .
    restart: unless-stopped
    environment:
      LLM_NAME: ${LLM_NAME:-swiss-ai/apertus-70b-instruct}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.publicai.co/v1}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in the environment or in track_2b/.env}
      DATABASE_URL: postgresql+psycopg://alpenstroke:${POSTGRES_PASSWORD:-alpenstroke}@db:5432/alpenstroke
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
