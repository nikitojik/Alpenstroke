<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Alpenstroke{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <a class="wordmark" href="/">Alpenstroke</a>
      <p class="masthead__note">Swim training log with an AI coach</p>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      Runs on Apertus, Switzerland's open language model. A training aid, not medical advice.
    </footer>
  </div>
</body>
</html>
